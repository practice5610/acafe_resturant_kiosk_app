<!DOCTYPE html><html spellcheck="false"><head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Acafe Kiosk">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Acafe">
  <link rel="apple-touch-icon" href="favicon.png">
  <title>Acafe</title>
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      background-color: #E8E6DF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    /* Flutter html-renderer hosts. Chrome's swipe-to-navigate targets the
       nearest scroll root, which is often one of these rather than <body>. */
    flt-glass-pane, flt-scene-host, flutter-view, canvas {
      overscroll-behavior: none;
      overscroll-behavior-x: none;
    }
    flutter-loader, .flutter-loader, #flutter-loading, .loading-progress, progress {
      display: none !important;
    }
    .grecaptcha-badge { visibility: hidden; }
  </style>

  <script>
    var serviceWorkerVersion = {{flutter_service_worker_version}};
  </script>
  <script src="flutter.js?version=11.5.0" defer></script>
</head>
<body spellcheck="false">

<script>
  if (typeof(Storage) !== "undefined") {
    localStorage.removeItem("flutter.theme");
  }

  // Block macOS Chrome/Safari two-finger swipe Back/Forward. Must be
  // non-passive so preventDefault is honoured. Do not stopPropagation —
  // Flutter still needs the wheel event for in-app horizontal lists.
  (function () {
    if (window.__kioskSwipeNavGuard) return;
    window.__kioskSwipeNavGuard = true;
    function blockHistorySwipe(e) {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        e.preventDefault();
      }
    }
    var opts = { passive: false, capture: true };
    window.addEventListener('wheel', blockHistorySwipe, opts);
    window.addEventListener('mousewheel', blockHistorySwipe, opts);
  })();
</script>

<script defer>
  {{flutter_js}}
  {{flutter_build_config}}

  _flutter.loader.load({
    serviceWorker: {
      serviceWorkerVersion: {{flutter_service_worker_version}},
    },
    onEntrypointLoaded: function(engineInitializer) {
      engineInitializer.initializeEngine({ renderer: 'html' }).then(function(appRunner) {
        appRunner.runApp();
      });
    }
  });
</script>

</body></html>
